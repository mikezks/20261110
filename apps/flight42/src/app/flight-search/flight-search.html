<div class="card">
  <div class="card-header">
    <h2 class="card-title">Flight Search</h2>
  </div>
  <div class="card-body">
    <form>
      <div class="form-group">
        <label for="from">From:</label>
        <input [formField]="searchForm.from" id="from" type="text" class="form-control">
      </div>
      <div class="form-group">
        <label for="to">To:</label>
        <input [formField]="searchForm.to" id="to" type="text" class="form-control">
      </div>
    </form>
    <div class="form-group">
      <button (click)="search()" class="btn btn-default">Search</button>
    </div>
  </div>
</div>
